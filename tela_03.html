<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela 03 - Destaques Mobile</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/navigation.css">
  <link rel="stylesheet" href="../css/card.css">
  <link rel="stylesheet" href="../css/button.css">
</head>
<body>

  <!-- Cabeçalho Mobile -->

        <div class="card__content">

        <div class="card__content">

        </div>
      </article>

      <article class="card">
        <div class="card__image" style="height: 160px;"></div>

        <div class="card__image" style="height: 160px;"></div>
        <div class="card__content">
          <h4 class="card__title">Destaque 8</h4>
        </div>
      </article>

      <article class="card">
        <div class="card__image" style="height: 160px;"></div>
        <div class="card__content">
          <h4 class="card__title">Destaque 9</h4>
        </div>
      </article>

    </section>

    <!-- Footer Tags -->
    <section class="section" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px;">
      <span class="button button--secondary" style="width: auto; font-size: 12px;">Instagram</span>
      <span class="button button--secondary" style="width: auto; font-size: 12px;">Work</span>
      <span class="button button--secondary" style="width: auto; font-size: 12px;">Bags</span>
      <span class="button button--secondary" style="width: auto; font-size: 12px;">Lamp</span>
      <span class="button button--secondary" style="width: auto; font-size: 12px;">Books</span>
    </section>

  <footer style="padding: 16px; font-size: 12px; color: var(--color-text-muted); text-align: center;">
